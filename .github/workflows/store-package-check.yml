name: Store package check
on:
  push:
    branches: [codex/store-verify]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store-windows:
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: --bundles msi --no-sign
      sign-binaries: false
      upload-artifacts: true
      asset-prefix: aivorelay-store-test
      is-debug-build: false
