name: "Release"

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
      store-sha: ${{ steps.store-source.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' src-tauri/tauri.conf.json)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Pin the Store edition to one commit and refuse a mismatched or updating config.
      - name: Resolve Microsoft Store edition source
        id: store-source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/microsoft-store" --jq '.object.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/contents/src-tauri/tauri.conf.json?ref=$sha"             --jq .content | base64 --decode > "$RUNNER_TEMP/store-config.json"
          jq -e --arg version "$VERSION" '.version == $version' "$RUNNER_TEMP/store-config.json" || {
            echo "release/microsoft-store is not at version $VERSION" >&2; exit 1; }
          jq -e '.bundle.createUpdaterArtifacts == false and ((.plugins.updater.endpoints // []) | length) == 0'             "$RUNNER_TEMP/store-config.json" || {
            echo "release/microsoft-store must not ship updater artifacts or endpoints" >&2; exit 1; }
          echo "Microsoft Store edition source: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.github/release-notes/main.md', 'utf8');

            const tag = `v${process.env.VERSION}`;
            // An existing tag must resolve to the exact commit being built.
            try {
              let { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              let object = ref.object;
              while (object.type === 'tag') {
                const { data } = await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha });
                object = data.object;
              }
              if (object.type !== 'commit' || object.sha !== context.sha) {
                throw new Error(`Release tag ${tag} does not point to ${context.sha}`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              body,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  build-windows:
    permissions:
      contents: read
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      sign-binaries: true
      asset-prefix: "aivorelay"
      upload-artifacts: true
      ref: ${{ github.sha }}
    secrets:
      CODE_CERT_MAXITSERVICE_01_2026: ${{ secrets.CODE_CERT_MAXITSERVICE_01_2026 }}
      WIN_PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}

  # Microsoft Store edition for installing outside the Store: no secrets,
  # no Authenticode, no updater. Its assets are never listed in latest.json.
  build-store-windows:
    permissions:
      contents: read
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      sign-binaries: false
      asset-prefix: "aivorelay-store"
      upload-artifacts: true
      ref: ${{ needs.create-release.outputs.store-sha }}

  # Separate from Windows so these builds receive no platform signing secrets.
  # Separate jobs preserve each immutable artifact ID; matrix outputs overwrite.
  build-linux:
    permissions:
      contents: read
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      platform: "ubuntu-24.04"
      target: "x86_64-unknown-linux-gnu"
      # Release-only override; package checks keep their platform defaults.
      build-args: >-
        --bundles appimage,deb,rpm --config '{"bundle":{"createUpdaterArtifacts":true}}'
      sign-binaries: false
      asset-prefix: "aivorelay"
      upload-artifacts: true
      ref: ${{ github.sha }}

  build-macos:
    permissions:
      contents: read
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      platform: "macos-26"
      target: "aarch64-apple-darwin"
      build-args: >-
        --target aarch64-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
      sign-binaries: false
      asset-prefix: "aivorelay"
      upload-artifacts: true
      ref: ${{ github.sha }}

  publish:
    permissions:
      contents: write
    needs: [create-release, build-windows, build-store-windows, build-linux, build-macos]
    uses: ./.github/workflows/publish.yml
    with:
      release-id: ${{ needs.create-release.outputs.release-id }}
      version: ${{ needs.create-release.outputs.version }}
      windows-artifact-id: ${{ needs.build-windows.outputs.windows-artifact-id }}
      store-windows-artifact-id: ${{ needs.build-store-windows.outputs.windows-artifact-id }}
      linux-artifact-id: ${{ needs.build-linux.outputs.linux-artifact-id }}
      macos-artifact-id: ${{ needs.build-macos.outputs.macos-artifact-id }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
