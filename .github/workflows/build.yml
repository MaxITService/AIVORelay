name: "Build"

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      build-args:
        required: false
        type: string
        default: ""
      asset-prefix:
        required: false
        type: string
        default: "aivorelay"
      upload-artifacts:
        required: false
        type: boolean
        default: false
      sign-binaries:
        required: false
        type: boolean
        default: false
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ${{ github.ref }}
      is-debug-build:
        required: false
        type: boolean
        default: false
    secrets:
      CODE_CERT_MAXITSERVICE_01_2026:
        required: false
      WIN_PFX_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_ID_PASSWORD:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
    # Only release payload artifacts, never frontend sourcemaps.
    outputs:
      windows-artifact-id:
        description: Windows MSI, portable ZIP and, when signed, certificate files
        value: ${{ jobs.build.outputs.windows-artifact-id }}
      linux-artifact-id:
        description: Linux AppImage, deb and RPM packages
        value: ${{ jobs.build.outputs.linux-artifact-id }}
      macos-artifact-id:
        description: macOS app bundle, updater archive and DMG
        value: ${{ jobs.build.outputs.macos-artifact-id }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ inputs.platform }}
    outputs:
      windows-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
      linux-artifact-id: ${{ steps.upload-linux.outputs.artifact-id }}
      macos-artifact-id: ${{ steps.upload-macos.outputs.artifact-id }}
    steps:
      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          # Build scripts and dependencies do not need persisted credentials.
          persist-credentials: false

      - name: Import Certificate to Windows Store
        if: contains(inputs.platform, 'windows') && inputs.sign-binaries
        shell: pwsh
        env:
          WIN_PFX_B64: ${{ secrets.CODE_CERT_MAXITSERVICE_01_2026 }}
          WIN_PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}
        run: |
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host " IMPORT CERTIFICATE TO WINDOWS STORE" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          # Check if secrets are available
          if ([string]::IsNullOrWhiteSpace($env:WIN_PFX_B64)) {
            Write-Host "ERROR: WIN_PFX_B64 secret is empty or not set!" -ForegroundColor Red
            exit 1
          }
          Write-Host "WIN_PFX_B64 secret    = (set, $($env:WIN_PFX_B64.Length) chars)" -ForegroundColor Green

          if ([string]::IsNullOrWhiteSpace($env:WIN_PFX_PASSWORD)) {
            Write-Host "ERROR: WIN_PFX_PASSWORD secret is empty or not set!" -ForegroundColor Red
            exit 1
          }
          Write-Host "WIN_PFX_PASSWORD      = (set, $($env:WIN_PFX_PASSWORD.Length) chars)" -ForegroundColor Green

          # Decode and write PFX
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          Write-Host "PFX output path       = $pfxPath"

          try {
            $b64 = $env:WIN_PFX_B64 -replace "`r","" -replace "`n",""
            $bytes = [Convert]::FromBase64String($b64)
            Write-Host "Base64 decoded        = $($bytes.Length) bytes" -ForegroundColor Green
            [IO.File]::WriteAllBytes($pfxPath, $bytes)
          }
          catch {
            Write-Host "ERROR: Failed to decode Base64 or write file: $($_.Exception.Message)" -ForegroundColor Red
            exit 1
          }

          # Verify file was created
          if (!(Test-Path $pfxPath)) {
            Write-Host "ERROR: PFX file was not created!" -ForegroundColor Red
            exit 1
          }

          $fileSize = (Get-Item $pfxPath).Length
          Write-Host "PFX file created      = $fileSize bytes" -ForegroundColor Green

          if ($fileSize -lt 100) {
            Write-Host "ERROR: PFX file is too small, likely corrupted!" -ForegroundColor Red
            exit 1
          }

          # Import certificate into Windows Certificate Store
          Write-Host ""
          Write-Host "Importing certificate into Cert:\CurrentUser\My..." -ForegroundColor Yellow

          try {
            $securePassword = ConvertTo-SecureString -String $env:WIN_PFX_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
            
            Write-Host "Certificate imported successfully!" -ForegroundColor Green
            Write-Host "  Subject:    $($cert.Subject)"
            Write-Host "  Thumbprint: $($cert.Thumbprint)"
            Write-Host "  NotAfter:   $($cert.NotAfter)"
          }
          catch {
            Write-Host "ERROR: Failed to import certificate: $($_.Exception.Message)" -ForegroundColor Red
            exit 1
          }

          # Verify certificate is in store
          $installedCert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq "C1F83B324662E8D224282F9D587B030426346A77" }
          if ($installedCert) {
            Write-Host ""
            Write-Host "Certificate verified in store!" -ForegroundColor Green
          } else {
            Write-Host "WARNING: Certificate not found in store after import!" -ForegroundColor Yellow
          }

          # Clean up temp file
          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue

          Write-Host "========================================" -ForegroundColor Cyan

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine build profile
        id: build-profile
        shell: bash
        run: |
          if [[ "${{ inputs.is-debug-build }}" == "true" ]]; then
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            echo "Build profile: debug"
          else
            echo "profile=release" >> "$GITHUB_OUTPUT"
            echo "Build profile: release"
          fi

      - name: Setup Bun (standard)
        if: ${{ !(contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')) }}
        uses: oven-sh/setup-bun@v2

      # Bun does not fully support Windows ARM64 yet, so we pin the baseline build.
      # See https://github.com/oven-sh/bun/issues/9824 for details.
      - name: Setup Bun (Windows ARM64 baseline)
        if: ${{ contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64') }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64-baseline.zip"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ contains(inputs.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Editions differ in CPU flags; keep their compiled dependencies apart.
          key: ${{ inputs.platform }}-${{ inputs.target }}-${{ inputs.asset-prefix }}

      - name: Prepare short Rust target dir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $targetDir = "$drive\t"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          "CARGO_TARGET_DIR=$targetDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using short CARGO_TARGET_DIR $targetDir"

      # Native Windows ARM64 links transcribe.cpp statically and CPU-only.
      # ggml requires clang-cl on ARM; pin a portable CPU baseline and disable
      # the OpenMP path whose clang runtime is not linked by this toolchain.
      - name: Configure cmake for ARM64 (Windows)
        if: contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_C_COMPILER=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_CXX_COMPILER=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_C_COMPILER_TARGET=aarch64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_CXX_COMPILER_TARGET=aarch64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CL=/EHsc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RC=llvm-rc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRANSCRIBE_CMAKE_ARGS=-DGGML_NATIVE=OFF -DGGML_OPENMP=OFF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: install dependencies (ubuntu 24.04 x64)
        if: contains(inputs.platform, 'ubuntu-24.04') && !contains(inputs.platform, 'arm')
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libgtk-layer-shell0 libgtk-layer-shell-dev \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2

      - name: install dependencies (ubuntu 24.04 arm64)
        if: contains(inputs.platform, 'ubuntu-24.04-arm')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libgtk-layer-shell0 libgtk-layer-shell-dev xdg-utils

      - name: install dependencies (ubuntu 22.04)
        if: contains(inputs.platform, 'ubuntu-22.04')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libgtk-layer-shell0 libgtk-layer-shell-dev

      - name: Verify gtk-layer-shell runtime dependency (Ubuntu)
        if: contains(inputs.platform, 'ubuntu')
        run: |
          dpkg-query -W -f='${Status}\n' libgtk-layer-shell0 | grep -q "install ok installed"
          ldconfig -p | grep -q "libgtk-layer-shell.so.0"

      - name: Verify OpenBLAS runtime dependency (Ubuntu)
        if: contains(inputs.platform, 'ubuntu')
        run: |
          ldconfig -p | grep -q "libopenblas.so.0"

      - name: Install Vulkan SDK (Windows x64)
        if: contains(inputs.platform, 'windows') && !contains(inputs.target, 'aarch64')
        # Reviewed upstream PR #24 upgrades the nested cache action to Node 24.
        # Replace this immutable SHA with an official release commit after merge.
        # https://github.com/humbletim/install-vulkan-sdk/pull/24
        uses: humbletim/install-vulkan-sdk@abf95d9696226559c5024544c4a072d50eb007bd
        with:
          version: 1.4.309.0
          cache: true

      - name: Bundle Vulkan Loader DLL (Windows x64)
        if: contains(inputs.platform, 'windows') && !contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          Write-Host "Copying vulkan-1.dll to src-tauri for bundling..."
          $vulkanDll = Join-Path $env:VULKAN_SDK "Bin\vulkan-1.dll"
          $targetDir = "src-tauri"

          if (Test-Path $vulkanDll) {
            Copy-Item $vulkanDll -Destination $targetDir -Force
            $size = [math]::Round((Get-Item "$targetDir\vulkan-1.dll").Length / 1MB, 2)
            Write-Host "Successfully copied vulkan-1.dll ($size MB) to $targetDir"
          } else {
            Write-Host "WARNING: vulkan-1.dll not found at $vulkanDll"
            # Try to find it in System32 as fallback
            $systemDll = "C:\Windows\System32\vulkan-1.dll"
            if (Test-Path $systemDll) {
              Copy-Item $systemDll -Destination $targetDir -Force
              Write-Host "Copied vulkan-1.dll from System32 instead"
            } else {
              Write-Host "ERROR: Could not find vulkan-1.dll anywhere!"
              exit 1
            }
          }

      # The pinned install-vulkan-sdk revision cannot target Windows ARM64 yet.
      # Download prebuilt binaries (Bin) + build headers/libs from source.
      # See https://github.com/humbletim/install-vulkan-sdk/pull/22 for prebuilt ARM64 support progress.
      - name: Prepare Vulkan SDK env (Windows ARM64)
        if: contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          $sdkDir = Join-Path $env:GITHUB_WORKSPACE "VULKAN_SDK"
          New-Item -ItemType Directory -Force -Path $sdkDir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$sdkDir"

      - name: Download Vulkan SDK binaries (Windows ARM64)
        if: contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/1.4.309.0/warm/InstallVulkanARM64-1.4.309.0.exe"
          $outFile = "vulkan_sdk_arm.exe"
          Write-Host "Downloading Vulkan SDK binaries from $url"
          Invoke-WebRequest -Uri $url -OutFile $outFile

      - name: Extract Vulkan SDK binaries (Windows ARM64)
        if: contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          $sdkDir = $env:VULKAN_SDK
          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          Write-Host "Extracting binaries to $sdkDir"
          & $sevenZip x "./vulkan_sdk_arm.exe" "-o$sdkDir" -aoa
          $binPath = Join-Path $sdkDir "Bin"
          Add-Content -Path $env:GITHUB_PATH -Value $binPath
          Write-Host "Verifying glslc..."
          & (Join-Path $binPath "glslc.exe") --version

      - name: Build Vulkan SDK headers and libs (Windows ARM64)
        if: contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.309.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Bundle Vulkan Loader DLL (Windows ARM64)
        if: contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          Write-Host "Copying vulkan-1.dll to src-tauri for bundling (ARM64)..."
          $vulkanDll = Join-Path $env:VULKAN_SDK "Bin\vulkan-1.dll"
          $targetDir = "src-tauri"

          if (Test-Path $vulkanDll) {
            Copy-Item $vulkanDll -Destination $targetDir -Force
            $size = [math]::Round((Get-Item "$targetDir\vulkan-1.dll").Length / 1MB, 2)
            Write-Host "Successfully copied vulkan-1.dll ($size MB) to $targetDir"
          } else {
            Write-Host "ERROR: vulkan-1.dll not found at $vulkanDll"
            exit 1
          }

      - name: Prepare Vulkan SDK for Ubuntu 24.04
        if: contains(inputs.platform, 'ubuntu-24.04') && !contains(inputs.platform, 'arm')
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-noble.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-noble.list
          sudo apt update
          sudo apt install vulkan-sdk -y
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Prepare Vulkan SDK for Ubuntu ARM64
        if: contains(inputs.platform, 'ubuntu') && contains(inputs.platform, 'arm')
        # Third-party action pinned to an immutable commit (v1).
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533
        with:
          vulkan_version: 1.4.335.0
          cache: true

      - name: Install Vulkan runtime libraries (Ubuntu ARM64)
        if: contains(inputs.platform, 'ubuntu') && contains(inputs.platform, 'arm')
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers

      - name: Prepare Vulkan SDK for Ubuntu 22.04
        if: contains(inputs.platform, 'ubuntu-22.04')
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-jammy.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-jammy.list
          sudo apt update
          sudo apt install vulkan-sdk -y
          sudo apt-get install -y mesa-vulkan-drivers

      - name: install frontend dependencies
        if: ${{ !(contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')) }}
        run: bun install

      - name: install frontend dependencies (Windows ARM64)
        if: ${{ contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64') }}
        run: bun install --cpu=arm64

      - name: rustup install target
        if: ${{ inputs.target != '' && !contains(inputs.target, 'unknown-linux-gnu') && !contains(inputs.target, 'x86_64-pc-windows-msvc') }}
        run: rustup target add ${{ inputs.target }}

      - name: Locate VC++ runtime redist for app-local bundling (Windows)
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $arch = if ("${{ inputs.target }}" -like "aarch64*") { "arm64" } else { "x64" }
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\$arch"
          if (-not (Test-Path $archDir)) { throw "VC++ redist arch dir not found: $archDir" }

          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
            throw "VC++ CRT redist dir not found or incomplete under: $archDir"
          }
          $dirs = $crt.FullName

          if ($arch -eq "x64") {
            $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" |
              Sort-Object Name | Select-Object -Last 1
            if (-not $omp -or -not (Test-Path (Join-Path $omp.FullName "vcomp140.dll"))) {
              throw "VC++ OpenMP redist dir not found or incomplete under: $archDir"
            }
            $dirs = "$($crt.FullName);$($omp.FullName)"
          }

          Write-Host "HANDY_VC_REDIST_DIRS=$dirs"
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$dirs"

      - name: Point tauri-bundler at signtool.exe (Windows ARM64)
        if: contains(inputs.platform, 'windows') && contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $candidates = @(
            Get-ChildItem "$bin\10.0.*\arm64\signtool.exe" -ErrorAction SilentlyContinue
            Get-ChildItem "$bin\10.0.*\x64\signtool.exe" -ErrorAction SilentlyContinue
          ) | Where-Object { $_ }
          if (-not $candidates) {
            throw "signtool.exe not found under $bin"
          }
          $signtool = $candidates |
            Sort-Object { $_.FullName -match '\\arm64\\' }, FullName |
            Select-Object -Last 1
          Write-Host "TAURI_WINDOWS_SIGNTOOL_PATH=$($signtool.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_WINDOWS_SIGNTOOL_PATH=$($signtool.FullName)"

      - name: import Apple Developer Certificate
        if: contains(inputs.platform, 'macos') && inputs.sign-binaries
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: verify certificate
        if: contains(inputs.platform, 'macos') && inputs.sign-binaries
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."

      # ggml-vulkan (built by transcribe-cpp-sys when the Vulkan backend is on)
      # requires a findable SPIRV-HeadersConfig.cmake. The CI Vulkan SDK does not
      # expose one, so provide the header-only package via vcpkg and add its
      # prefix to CMAKE_PREFIX_PATH. Windows ARM64 is CPU-only.
      - name: Install SPIRV-Headers for transcribe-cpp Vulkan build (Windows x64)
        if: contains(inputs.platform, 'windows') && !contains(inputs.target, 'aarch64')
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"
          Write-Host "CMAKE_PREFIX_PATH=$combined"

      # transcribe-cpp ships as a shared libtranscribe + loadable ggml backend
      # modules on Linux (the `dynamic-backends` posture). They are produced by
      # transcribe-cpp-sys's CMake install during the cargo build, but nothing
      # ships them. Pre-build the app so that install dir exists, then expose it
      # via LD_LIBRARY_PATH so the AppImage's linuxdeploy can resolve
      # libtranscribe.so (a NEEDED of `aivorelay`) while bundling. tauri-action
      # reuses this compile incrementally. build.rs stages the runtime and
      # dlopen'd modules into transcribe-libs/, which tauri.conf.json includes.
      - name: Pre-build and locate transcribe-cpp backend libs (Linux)
        if: contains(inputs.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ steps.build-profile.outputs.profile }}"
          # Frontend must exist for the app crate to compile (generate_context!).
          bun run build
          (
            cd src-tauri
            if [ "$PROFILE" = "release" ]; then cargo build --release; else cargo build; fi
          )
          # The install manifest sits next to libtranscribe in <crate-out>/lib.
          # Pick the newest match in case a stale build dir lingers in the cache.
          LIBDIR="$(find "src-tauri/target/$PROFILE/build" \
            -type f -name transcribe-link.json -path '*transcribe-cpp-sys*/out/lib/*' \
            -printf '%T@ %h\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)"
          if [ -z "${LIBDIR:-}" ] || [ ! -d "$LIBDIR" ]; then
            echo "ERROR: could not locate transcribe-cpp-sys install lib dir" >&2
            find src-tauri/target \( -name 'libtranscribe*' -o -name 'libggml*' \) 2>/dev/null >&2 || true
            exit 1
          fi
          LIBDIR="$(cd "$LIBDIR" && pwd)"
          echo "Located transcribe-cpp libs in: $LIBDIR"
          ls -la "$LIBDIR"
          echo "LD_LIBRARY_PATH=$LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          # linuxdeploy resolves `aivorelay`'s NEEDED libs via `ldd` and HARD-FAILS
          # on an unresolved one (it does not warn-and-skip). libtranscribe.so
          # lives only in the cargo build tree, so also publish it (and the ggml
          # libs it pulls in) to the system linker cache — belt-and-suspenders
          # with LD_LIBRARY_PATH so resolution never hinges on env propagation
          # into the bundler subprocess. (Only affects the CI host; the AppImage
          # gets its own co-located copies.)
          sudo cp -vL "$LIBDIR"/libtranscribe.so* "$LIBDIR"/libggml*.so* /usr/local/lib/ 2>/dev/null || true
          sudo ldconfig

      # Tauri's mirrored 2024 linuxdeploy predates support for the
      # LINUXDEPLOY_EXCLUDED_LIBRARIES environment variable. Put a current
      # upstream build in Tauri's tool cache so the exclusions on the build step
      # are applied while constructing the original, signed AppImage.
      # The bundler skips any tool already in the cache (tauri-bundler 2.9.4
      # linuxdeploy.rs prepare_tools). Tauri's own helpers it would fetch from
      # moving URLs are pinned and hash-checked here. The linuxdeploy project
      # only publishes in-place continuous builds, so its tools are trusted as is.
      - name: Install AppImage tools
        if: contains(inputs.platform, 'ubuntu') && contains(inputs.build-args, 'appimage')
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch="x86_64"
              apprun_sha256="f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f" ;;
            aarch64|arm64)
              arch="aarch64"
              apprun_sha256="072f17c0895a85c490282fe5395c5007e5fc75da727e553b3b8fb680feb11578" ;;
            *) echo "Unsupported linuxdeploy architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          tools_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$tools_dir"
          fetch() {
            curl -L --fail --show-error --retry 3 -o "$tools_dir/$1" "$2"
            if [[ -n "${3:-}" ]]; then printf '%s  %s\n' "$3" "$tools_dir/$1" | sha256sum -c -; fi
            chmod +x "$tools_dir/$1"
          }
          fetch "linuxdeploy-${arch}.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${arch}.AppImage"
          fetch "AppRun-${arch}" \
            "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-${arch}" \
            "$apprun_sha256"
          fetch linuxdeploy-plugin-gtk.sh \
            "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/dda522bce37387f1b853d9095713bfaa924c8423/linuxdeploy-plugin-gtk.sh" \
            "7804c9eef13e59bf2783aad9882ef9db8f3f3f9e8d631874b1d348d550a3693f"
          fetch linuxdeploy-plugin-gstreamer.sh \
            "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/2a2e67491c32995a3f279ad0ecbe77abd512b42a/linuxdeploy-plugin-gstreamer.sh" \
            "c107b49d84edbffc6ab226ed1007e0626a4f7aa2c3a36b7782bef62351d49e94"
          "$tools_dir/linuxdeploy-${arch}.AppImage" --appimage-extract-and-run --version

      # Disposable updater key only: keep Authenticode and macOS ad-hoc signing.
      # CLI 2.11.4 bundle.rs warns on a pubkey mismatch; publish replaces these sigs.
      - name: Generate disposable updater build key
        id: updater-build-key
        shell: bash
        run: |
          set -euo pipefail
          bunx tauri signer generate --ci -p '' -w "$RUNNER_TEMP/updater-build.key"
          echo "path=$RUNNER_TEMP/updater-build.key" >> "$GITHUB_OUTPUT"

      # Tauri treats a signing variable that is set but empty as "sign with this
      # certificate" and fails, so the unsigned macOS build below leaves them
      # undefined. This step covers every other build.
      - name: Build with Tauri
        if: ${{ !(contains(inputs.platform, 'macos') && !inputs.sign-binaries) }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          # Hidden frontend sourcemaps, written outside the app (see vite.config.ts).
          AIVORELAY_SOURCEMAPS: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.updater-build-key.outputs.path }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPLE_ID: ${{ contains(inputs.platform, 'macos') && inputs.sign-binaries && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ contains(inputs.platform, 'macos') && inputs.sign-binaries && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_PASSWORD: ${{ contains(inputs.platform, 'macos') && inputs.sign-binaries && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ contains(inputs.platform, 'macos') && inputs.sign-binaries && secrets.APPLE_TEAM_ID || '' }}
          APPLE_CERTIFICATE: ${{ contains(inputs.platform, 'macos') && inputs.sign-binaries && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ contains(inputs.platform, 'macos') && inputs.sign-binaries && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ contains(inputs.platform, 'macos') && inputs.sign-binaries && env.CERT_ID || '' }}
          # The Vulkan loader and Wayland client library must come from the host
          # graphics stack. Bundling Ubuntu's copies ahead of the system libraries can
          # prevent a newer distro's Vulkan ICD or Mesa stack from loading.
          # linuxdeploy reads this semicolon-separated glob list before it creates
          # the AppImage, so the published artifact is already clean.
          LINUXDEPLOY_EXCLUDED_LIBRARIES: ${{ contains(inputs.platform, 'ubuntu') && 'libvulkan.so*;libwayland-client.so*' || '' }}
          # linuxdeploy passes this to appimagetool, which writes it as
          # X-AppImage-Version for desktop integration tools such as Gear Lever.
          LINUXDEPLOY_OUTPUT_VERSION: ${{ contains(inputs.platform, 'ubuntu') && steps.get-version.outputs.version || '' }}
        with:
          args: ${{ inputs.build-args }}

      - name: Build with Tauri (macOS, unsigned)
        if: ${{ contains(inputs.platform, 'macos') && !inputs.sign-binaries }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          # No Apple credentials: macOS keeps its configured ad-hoc signature.
          # Hidden frontend sourcemaps, written outside the app (see vite.config.ts).
          AIVORELAY_SOURCEMAPS: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.updater-build-key.outputs.path }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: ${{ inputs.build-args }}

      # Uploaded even for releases: decodes frontend stack traces in user logs.
      - name: Upload frontend sourcemaps
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}-sourcemaps
          path: dist-sourcemaps/
          if-no-files-found: warn
          retention-days: 90

      # Filter inside linuxdeploy before signing; verify the packaged artifact.
      - name: Verify AppImage version metadata
        if: contains(inputs.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ steps.build-profile.outputs.profile }}"
          APPIMAGE_PATH="$(find "src-tauri/target/${PROFILE}/bundle/appimage" -name '*.AppImage' -print -quit 2>/dev/null || true)"
          if [ -z "$APPIMAGE_PATH" ]; then
            echo "No AppImage produced by this Linux build; skipping metadata verification"
            exit 0
          fi
          APPIMAGE_PATH="$(readlink -f "$APPIMAGE_PATH")"
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          (
            cd "$WORKDIR"
            # AppImage integration tools read the root desktop entry. appimagetool
            # adds X-AppImage-Version there, not to the source copy under usr/share.
            "$APPIMAGE_PATH" --appimage-extract '*.desktop' >/dev/null
            DESKTOP_FILE="$(find squashfs-root -maxdepth 1 -type f -name '*.desktop' -print -quit)"
            if [ -z "$DESKTOP_FILE" ]; then
              echo "ERROR: AppImage desktop metadata is missing" >&2
              exit 1
            fi
            if ! grep -Fqx 'X-AppImage-Version=${{ steps.get-version.outputs.version }}' "$DESKTOP_FILE"; then
              echo "ERROR: AppImage version metadata is missing or incorrect:" >&2
              grep -E '^X-AppImage-Version=' "$DESKTOP_FILE" >&2 || true
              exit 1
            fi
          )

      - name: Upload artifacts (macOS)
        id: upload-macos
        if: inputs.upload-artifacts && contains(inputs.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          path: |
            src-tauri/target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/dmg/*.dmg
            src-tauri/target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos/*.app
            src-tauri/target/${{ inputs.target }}/${{ steps.build-profile.outputs.profile }}/bundle/macos/*.app.tar.gz
          retention-days: 30

      - name: Audit Linux package runtime contents
        if: contains(inputs.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail

          # The runtime smoke test launches the packaged aivorelay binary, which links
          # GTK (via tao) even for the headless --list-devices path and therefore
          # needs a display to start. CI runners are headless, so provide a virtual
          # X server via xvfb-run.
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

          PROFILE="${{ steps.build-profile.outputs.profile }}"
          BUNDLE_DIR="src-tauri/target/${PROFILE}/bundle"

          require_pattern() {
            local listing="$1"
            local pattern="$2"
            local label="$3"
            if ! grep -Eq "$pattern" "$listing"; then
              echo "ERROR: missing ${label} (${pattern}) in ${listing}" >&2
              cat "$listing" >&2
              exit 1
            fi
          }

          require_path() {
            local path="$1"
            local label="$2"
            if [ ! -e "$path" ]; then
              echo "ERROR: missing ${label}: ${path}" >&2
              find "$(dirname "$path")" -maxdepth 2 -type f 2>/dev/null >&2 || true
              exit 1
            fi
          }

          smoke_binary() {
            local root="$1"
            local label="$2"
            local vulkan_icd="${3:-}"
            # Run under a virtual X server: aivorelay initializes GTK on startup even
            # on the headless --list-devices path, which fails without a display.
            # An AppImage audit supplies Mesa's software ICD so GPU registration
            # is deterministic even on a runner without physical graphics.
            if [ -n "$vulkan_icd" ]; then
              export VK_ICD_FILENAMES="$vulkan_icd"
            fi
            AIVORELAY_NO_GTK_LAYER_SHELL=1 \
            LD_LIBRARY_PATH="${root}/usr/lib/AivoRelay:${root}/usr/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
              xvfb-run -a "${root}/usr/bin/aivorelay" --list-devices \
                >/tmp/aivorelay-package-smoke.log 2>&1
            echo "${label} --list-devices smoke passed"
          }

          if compgen -G "${BUNDLE_DIR}/deb/*.deb" > /dev/null; then
            for deb in "${BUNDLE_DIR}"/deb/*.deb; do
              echo "Auditing deb package: ${deb}"
              listing="$(mktemp)"
              dpkg-deb -c "$deb" > "$listing"
              require_pattern "$listing" 'usr/bin/aivorelay$' "aivorelay binary"
              require_pattern "$listing" 'usr/lib/AivoRelay/libtranscribe\.so(\.[0-9]+)+$' "transcribe runtime library (SONAME)"
              require_pattern "$listing" 'usr/lib/AivoRelay/libggml-cpu.*\.so' "ggml CPU backend module"
              # AivoRelay's libs must stay out of the ldconfig-scanned /usr/lib
              # (issue #1639): app-private libs belong in /usr/lib/AivoRelay only.
              # `[^/]+` excludes the AivoRelay/ subdir, so only direct hits match.
              if grep -Eq 'usr/lib/[^/]+\.so' "$listing"; then
                echo "ERROR: libraries installed directly into /usr/lib (issue #1639):" >&2
                grep -E 'usr/lib/[^/]+\.so' "$listing" >&2
                exit 1
              fi
              root="$(mktemp -d)"
              dpkg-deb -x "$deb" "$root"
              smoke_binary "$root" "deb"
              rm -rf "$root" "$listing"
            done
          fi

          if compgen -G "${BUNDLE_DIR}/rpm/*.rpm" > /dev/null; then
            if ! command -v rpm >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y rpm
            fi
            for rpm_pkg in "${BUNDLE_DIR}"/rpm/*.rpm; do
              echo "Auditing rpm package: ${rpm_pkg}"
              listing="$(mktemp)"
              rpm -qpl "$rpm_pkg" > "$listing"
              require_pattern "$listing" '/usr/bin/aivorelay$' "aivorelay binary"
              require_pattern "$listing" '/usr/lib/AivoRelay/libtranscribe\.so(\.[0-9]+)+$' "transcribe runtime library (SONAME)"
              require_pattern "$listing" '/usr/lib/AivoRelay/libggml-cpu.*\.so' "ggml CPU backend module"
              # Same /usr/lib pollution guard as the deb audit (issue #1639).
              if grep -Eq 'usr/lib/[^/]+\.so' "$listing"; then
                echo "ERROR: libraries installed directly into /usr/lib (issue #1639):" >&2
                grep -E 'usr/lib/[^/]+\.so' "$listing" >&2
                exit 1
              fi
              rm -f "$listing"
            done
          fi

          if compgen -G "${BUNDLE_DIR}/appimage/*.AppImage" > /dev/null; then
            for appimage in "${BUNDLE_DIR}"/appimage/*.AppImage; do
              echo "Auditing AppImage package: ${appimage}"
              workdir="$(mktemp -d)"
              cp "$appimage" "${workdir}/AivoRelay.AppImage"
              chmod +x "${workdir}/AivoRelay.AppImage"
              (
                cd "$workdir"
                ./AivoRelay.AppImage --appimage-extract >/dev/null
                require_path "squashfs-root/usr/bin/aivorelay" "AppImage aivorelay binary"
                # Gear Lever and other integration tools consume the root entry;
                # appimagetool does not update the copy under usr/share/applications.
                desktop_file="$(find squashfs-root -maxdepth 1 -type f -name '*.desktop' -print -quit)"
                require_path "$desktop_file" "AppImage desktop metadata"
                if ! grep -Fqx 'X-AppImage-Version=${{ steps.get-version.outputs.version }}' "$desktop_file"; then
                  echo "ERROR: AppImage version metadata is missing or incorrect:" >&2
                  grep -E '^X-AppImage-Version=' "$desktop_file" >&2 || true
                  exit 1
                fi
                # The SONAME (libtranscribe.so.N) is the name the loader
                # resolves; the bare .so alias may or may not be present.
                if ! find "squashfs-root/usr/lib" -name 'libtranscribe.so*' | grep -q .; then
                  echo "ERROR: missing AppImage transcribe runtime library" >&2
                  find "squashfs-root/usr/lib" -maxdepth 1 -type f >&2
                  exit 1
                fi
                if ! find "squashfs-root/usr/lib" -name 'libggml-cpu*.so*' | grep -q .; then
                  echo "ERROR: missing AppImage ggml CPU backend module" >&2
                  find "squashfs-root/usr/lib" -maxdepth 1 -type f >&2
                  exit 1
                fi
                require_path "squashfs-root/usr/lib/libggml-vulkan.so" "AppImage ggml Vulkan backend module"

                # These libraries mediate access to the host graphics stack.
                # Shipping build-host copies ahead of the system versions can
                # break Vulkan ICD or Mesa loading on newer distributions.
                for pattern in \
                  'libvulkan.so*' \
                  'libwayland-client.so*'; do
                  forbidden="$(find squashfs-root/usr -name "$pattern" -print -quit)"
                  if [ -n "$forbidden" ]; then
                    echo "ERROR: AppImage bundles host graphics loader: $forbidden" >&2
                    exit 1
                  fi
                done

                vulkan_icd="$(find /usr/share/vulkan/icd.d -type f -name 'lvp_icd*.json' -print -quit)"
                if [ -z "$vulkan_icd" ]; then
                  echo "ERROR: Mesa software Vulkan ICD is unavailable for the AppImage audit" >&2
                  exit 1
                fi
                smoke_binary "$(pwd)/squashfs-root" "AppImage" "$vulkan_icd"
                # llvmpipe is intentionally not exposed as a compute device by
                # ggml, but reaching this log proves the module loaded against a
                # usable system Vulkan loader/ICD instead of failing silently.
                if ! grep -q 'load_backend: loaded Vulkan backend' /tmp/aivorelay-package-smoke.log; then
                  echo "ERROR: AppImage could not initialize its Vulkan backend with a usable system ICD" >&2
                  cat /tmp/aivorelay-package-smoke.log >&2
                  exit 1
                fi
              )
              rm -rf "$workdir"
            done
          fi

      - name: Upload artifacts (Linux)
        id: upload-linux
        if: inputs.upload-artifacts && contains(inputs.platform, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.platform }}-${{ inputs.target }}
          path: |
            src-tauri/target/${{ steps.build-profile.outputs.profile }}/bundle/deb/*.deb
            src-tauri/target/${{ steps.build-profile.outputs.profile }}/bundle/appimage/*.AppImage
            src-tauri/target/${{ steps.build-profile.outputs.profile }}/bundle/rpm/*.rpm
          retention-days: 30

      - name: Create portable ZIP (Windows)
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          # Determine the target output directory
          $target = "${{ inputs.target }}"
          $profile = "${{ steps.build-profile.outputs.profile }}"
          $cargoTargetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "src-tauri/target" }
          if ($target -eq "x86_64-pc-windows-msvc" -or $target -eq "") {
            $targetDir = "$cargoTargetDir/$profile"
            $arch = "x64"
          } else {
            $targetDir = "$cargoTargetDir/$target/$profile"
            $arch = "arm64"
          }

          $version = "${{ steps.get-version.outputs.version }}"
          $prefix = "${{ inputs.asset-prefix }}"
          $zipName = "${prefix}_${version}_${arch}_portable.zip"
          $stagingDir = "portable-staging/AivoRelay_${version}_${arch}_portable"

          # Create staging directory
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          # Copy the exe
          $exePath = "$targetDir/AivoRelay.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "AivoRelay.exe not found at $exePath"
            exit 1
          }
          Copy-Item $exePath $stagingDir/

          $runtimeDlls = Get-ChildItem "src-tauri/transcribe-libs" -Filter "*.dll" -ErrorAction SilentlyContinue
          if (-not $runtimeDlls) {
            Write-Error "src-tauri/transcribe-libs contains no DLLs; Windows builds must stage app-local runtime DLLs"
            exit 1
          }
          foreach ($dll in $runtimeDlls) {
            Copy-Item $dll.FullName $stagingDir/ -Force
          }
          foreach ($required in @("msvcp140.dll", "vcruntime140.dll")) {
            if (-not (Test-Path (Join-Path $stagingDir $required))) {
              Write-Error "Portable package is missing required runtime DLL $required"
              exit 1
            }
          }
          if ($arch -eq "x64") {
            if (-not (Test-Path (Join-Path $stagingDir "vcomp140.dll"))) {
              Write-Error "Portable package is missing required OpenMP runtime DLL vcomp140.dll"
              exit 1
            }
            if (-not (Get-ChildItem $stagingDir -Filter "*transcribe*.dll" -ErrorAction SilentlyContinue)) {
              Write-Error "Portable package is missing the transcribe.cpp runtime DLL"
              exit 1
            }
            if (-not (Get-ChildItem $stagingDir -Filter "*ggml*.dll" -ErrorAction SilentlyContinue)) {
              Write-Error "Portable package is missing dynamic ggml backend modules"
              exit 1
            }
            foreach ($required in @("ggml-cpu-x64.dll", "ggml-cpu-haswell.dll")) {
              if (-not (Test-Path (Join-Path $stagingDir $required))) {
                Write-Error "Portable package is missing ggml CPU backend module $required"
                exit 1
              }
            }
          }

          # Copy the resources directory
          $resourcesPath = "$targetDir/resources"
          if (Test-Path $resourcesPath) {
            Copy-Item -Recurse $resourcesPath "$stagingDir/resources"
          } else {
            Write-Warning "Resources directory not found at $resourcesPath"
          }

          # Ensure Vulkan loader DLL is always present in portable package
          $vulkanRootPath = "$targetDir/vulkan-1.dll"
          $vulkanResourcePath = "$targetDir/resources/vulkan-1.dll"
          $vulkanStagingPath = "$stagingDir/vulkan-1.dll"

          if (Test-Path $vulkanRootPath) {
            Copy-Item $vulkanRootPath $vulkanStagingPath -Force
            Write-Host "Copied vulkan-1.dll from $vulkanRootPath"
          } elseif (Test-Path $vulkanResourcePath) {
            Copy-Item $vulkanResourcePath $vulkanStagingPath -Force
            Write-Host "Copied vulkan-1.dll from $vulkanResourcePath"
          } else {
            Write-Error "vulkan-1.dll not found in portable build output"
            exit 1
          }

          # Create the zip
          Compress-Archive -Path $stagingDir -DestinationPath $zipName
          Write-Host "Created portable ZIP: $zipName"
          echo "PORTABLE_ZIP_PATH=$zipName" >> $env:GITHUB_ENV
          echo "PORTABLE_ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Collect Windows MSI artifacts
        if: inputs.upload-artifacts && contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          $target = "${{ inputs.target }}"
          $profile = "${{ steps.build-profile.outputs.profile }}"
          $cargoTargetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "src-tauri/target" }
          if ($target -eq "x86_64-pc-windows-msvc" -or $target -eq "") {
            $bundleDir = "$cargoTargetDir/$profile/bundle/msi"
          } else {
            $bundleDir = "$cargoTargetDir/$target/$profile/bundle/msi"
          }

          $artifactDir = "windows-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $msiFiles = Get-ChildItem -Path $bundleDir -Filter *.msi -ErrorAction SilentlyContinue
          if (-not $msiFiles) {
            Write-Error "No MSI artifacts found in $bundleDir"
            exit 1
          }

          foreach ($msi in $msiFiles) {
            Copy-Item $msi.FullName "$artifactDir/" -Force
          }

      - name: Audit Windows MSI runtime contents
        if: contains(inputs.platform, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = "${{ inputs.target }}"
          $profile = "${{ steps.build-profile.outputs.profile }}"
          $cargoTargetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { "src-tauri/target" }
          if ($target -eq "x86_64-pc-windows-msvc" -or $target -eq "") {
            $bundleDir = "$cargoTargetDir/$profile/bundle/msi"
          } else {
            $bundleDir = "$cargoTargetDir/$target/$profile/bundle/msi"
          }
          $msi = Get-ChildItem $bundleDir -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI package found in $bundleDir for runtime audit" }

          $stagedDlls = Get-ChildItem "src-tauri/transcribe-libs" -Filter "*.dll"
          foreach ($required in @("msvcp140.dll", "vcruntime140.dll")) {
            if (-not ($stagedDlls | Where-Object { $_.Name -ieq $required })) {
              throw "Runtime staging is missing $required"
            }
          }
          if ("${{ inputs.target }}" -notlike "aarch64*") {
            if (-not ($stagedDlls | Where-Object { $_.Name -ieq "vcomp140.dll" })) {
              throw "Runtime staging is missing vcomp140.dll"
            }
            if (-not ($stagedDlls | Where-Object { $_.Name -like "*transcribe*" })) {
              throw "Runtime staging is missing the transcribe.cpp core DLL"
            }
            if (-not ($stagedDlls | Where-Object { $_.Name -like "*ggml*" })) {
              throw "Runtime staging is missing dynamic ggml backend modules"
            }
          }

          $installDir = Join-Path $env:RUNNER_TEMP "aivorelay-msi-runtime-audit"
          Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installDir | Out-Null
          $logFile = Join-Path $installDir "msi-admin-install.log"
          $msiArgs = "/a `"$($msi.FullName)`" /qn /L*v `"$logFile`" TARGETDIR=`"$installDir`""
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $msiArgs -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $logFile) { Get-Content $logFile | Out-Host }
            throw "Administrative MSI extraction failed with exit code $($process.ExitCode)"
          }

          $exe = Get-ChildItem $installDir -Filter "AivoRelay.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "MSI package is missing AivoRelay.exe" }
          foreach ($dll in $stagedDlls) {
            if (-not (Get-ChildItem $installDir -Filter $dll.Name -Recurse)) {
              throw "MSI package is missing staged runtime DLL $($dll.Name)"
            }
          }

          $deviceOutput = (& $exe.FullName --list-devices | Out-String)
          $deviceOutput | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "Packaged AivoRelay --list-devices failed" }
          if ($deviceOutput -notmatch "kind=cpu") {
            throw "Packaged AivoRelay did not expose its required CPU compute device"
          }
          if ("${{ inputs.target }}" -like "aarch64*" -and $deviceOutput -match "kind=(vulkan|cuda|metal|gpu)") {
            throw "Windows ARM64 package unexpectedly exposed a GPU compute device"
          }

      - name: Upload artifacts (Windows)
        id: upload-windows
        if: inputs.upload-artifacts && contains(inputs.platform, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.asset-prefix }}-${{ inputs.target }}
          path: |
            windows-artifacts/*.msi
            ${{ env.PORTABLE_ZIP_NAME }}
            ${{ inputs.sign-binaries && 'Certificate/install_Root_Cert-embedded-in-this-file.ps1' || '' }}
            ${{ inputs.sign-binaries && 'Certificate/max.root.cert.cer' || '' }}
          retention-days: 30

      - name: Remove disposable updater build key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/updater-build.key" "$RUNNER_TEMP/updater-build.key.pub"
