name: "Platform check"

# Compiles and tests the Rust backend on Linux and macOS, which cannot be built
# on the Windows development machine. Manual only. It reads the repository and
# nothing else: no secrets, no signing, no uploads, and a read-only token.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: platform-check-linux

      - name: install dependencies (ubuntu 24.04 x64)
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libgtk-layer-shell0 libgtk-layer-shell-dev \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2

      - name: Prepare Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-noble.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-noble.list
          sudo apt update
          sudo apt install vulkan-sdk -y
          sudo apt-get install -y mesa-vulkan-drivers

      # The Tauri context macro only needs the frontend folder to exist.
      - name: Stub frontend build output
        run: |
          mkdir -p dist
          echo '<!doctype html>' > dist/index.html

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: cargo test
        env:
          # build.rs stages the shared transcribe runtime here for packaging.
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/transcribe-libs
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: platform-check-macos

      - name: Stub frontend build output
        run: |
          mkdir -p dist
          echo '<!doctype html>' > dist/index.html

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

  windows:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare short Rust target dir
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $targetDir = "$drive\t"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          "CARGO_TARGET_DIR=$targetDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Third-party action pinned to an immutable commit, as in the build workflow.
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@abf95d9696226559c5024544c4a072d50eb007bd
        with:
          version: 1.4.309.0
          cache: true

      - name: Install SPIRV-Headers for the Vulkan backend
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      - name: Stub frontend build output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html>'

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: cargo test
        shell: pwsh
        run: |
          # build.rs stages the transcribe and ggml DLLs here; tests need them on PATH.
          $env:PATH = "$env:GITHUB_WORKSPACE\src-tauri\transcribe-libs;$env:PATH"
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
