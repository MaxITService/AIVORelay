name: "Package check"

# Builds debug packages for Linux (deb, rpm, AppImage, x64 and ARM64), macOS and Windows
# through the shared build workflow, then runs its package audit. Manual only.
# No secrets are passed to the called workflow, so nothing is signed or
# published: it proves the packaging steps work, not that a release can ship.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04 only: the prebuilt ONNX Runtime needs a newer glibc than 22.04.
          - platform: "ubuntu-24.04"
            args: "--debug --bundles appimage,deb,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm"
            args: "--debug --bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "macos-26"
            args: "--debug --target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "windows-latest"
            args: "--debug --bundles msi --config src-tauri/tauri.package-check.conf.json"
            target: "x86_64-pc-windows-msvc"
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "aivorelay-package-check"
      upload-artifacts: false
      is-debug-build: true
