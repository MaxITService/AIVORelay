name: "Build Test"

on: workflow_dispatch

jobs:
  # Windows and macOS builds. Windows signs with the repository's certificate
  # secrets, so this job inherits them.
  build-test:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # for Arm based macs (M1 and above). Uses macOS 26 for Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
            sign: false # no Apple signing secrets are configured: macOS builds are ad-hoc signed only
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
            sign: false
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
            sign: true
          - platform: "windows-11-arm" # for ARM64 Windows runner
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"
            sign: true

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: ${{ matrix.sign }}
      asset-prefix: "aivorelay-test"
      upload-artifacts: true
      is-debug-build: ${{ contains(matrix.args, '--debug') }}
    secrets: inherit

  # Linux builds are separate on purpose: no secrets are passed to the called
  # workflow and the token is read-only, so nothing in these jobs can see or use
  # the signing material. Linux packages are unsigned.
  build-test-linux:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # Build AppImage, .deb and RPM for ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "aivorelay-test"
      upload-artifacts: true
      is-debug-build: ${{ contains(matrix.args, '--debug') }}
