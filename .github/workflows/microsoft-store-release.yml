name: "Microsoft Store Release"

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' src-tauri/tauri.conf.json)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v8
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.github/release-notes/microsoft-store.md', 'utf8');

            const tag = `v${process.env.VERSION}-store`;
            // An existing tag must resolve to the exact commit being built.
            try {
              let { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              let object = ref.object;
              while (object.type === 'tag') {
                const { data } = await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha });
                object = data.object;
              }
              if (object.type !== 'commit' || object.sha !== context.sha) {
                throw new Error(`Release tag ${tag} does not point to ${context.sha}`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `v${process.env.VERSION} (Microsoft Store Edition)`,
              body,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  build-windows:
    permissions:
      contents: read
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      # Preserve main's Store workflow: Authenticode and updater artifacts remain on.
      sign-binaries: true
      asset-prefix: "aivorelay-store"
      upload-artifacts: true
      ref: ${{ github.sha }}
    secrets:
      CODE_CERT_MAXITSERVICE_01_2026: ${{ secrets.CODE_CERT_MAXITSERVICE_01_2026 }}
      WIN_PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}

  publish:
    permissions:
      contents: write
    needs: [create-release, build-windows]
    uses: ./.github/workflows/publish.yml
    with:
      release-id: ${{ needs.create-release.outputs.release-id }}
      version: ${{ needs.create-release.outputs.version }}
      channel: store
      windows-artifact-id: ${{ needs.build-windows.outputs.windows-artifact-id }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
